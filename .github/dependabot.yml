# =============================================================================
# Dependabot – Automated Dependency Updates
# =============================================================================
# Keeps GitHub Actions and npm dependencies up to date.
# Schedule: weekly on Sunday at 18:15 UTC (auto-merge step, see
# automation-templates docs/workflows/docker-maintenance.md).
#
# CRA Reference: Art. 10 Abs. 6 (timely security updates)
# =============================================================================

version: 2
updates:
  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "18:15"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # npm (VitePress + dev tooling)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "18:15"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "npm"
    groups:
      # Every patch and minor update in one PR per run, which the auto-merge
      # caller (dependabot-maintenance.yml) merges once nodejs-pr.yml passed.
      # 0.x packages are excluded: below 1.0.0 a minor counts as major for
      # the auto-merge gate, would turn the whole group major and hold it
      # open. They arrive as PRs of their own and wait for review. Remove a
      # package from exclude-patterns once it reaches 1.0.
      npm-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "markdownlint-cli2"
          - "vitepress-plugin-rss"
        update-types:
          - "minor"
          - "patch"
      # Majors keep their groups and wait for review.
      vitepress:
        patterns:
          - "vitepress"
        update-types:
          - "major"
      dev-tooling:
        patterns:
          - "markdownlint-cli2"
          - "linkinator"
          - "rimraf"
        update-types:
          - "major"
